<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>So Fast</title>
<style>/* fonts bundled locally for offline use */
@font-face{font-family:"Baloo 2";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:900;font-style:normal;font-display:swap;src:url(fonts/nunito-latin-900-normal.woff2) format("woff2")}
</style>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F1F3F4;
    --surface-press: #E3E8EC;
    --ink: #202124;
    --ink-soft: #5F6368;
    --blue: #1A73E8;
    --blue-tint: #E8F0FE;
    --green: #1E8E3E;
    --green-tint: #E6F4EA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100%;
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .screen { display: none; max-width: 680px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  .screen.on { display: block; }

  /* ---------- start screen ---------- */
  /* ---------- logo: leans right (it flies left-to-right), speed lines scattered around and through it ---------- */
  .brand { position: relative; display: inline-block; white-space: nowrap; line-height: 1;
    font-family: "Baloo 2", "Nunito", system-ui, sans-serif; font-weight: 700; letter-spacing: .03em;
    text-transform: uppercase; transform: skewX(-12deg); }
  .brand .word { position: relative; z-index: 1; display: inline-block;
    -webkit-text-stroke: .018em #3C4043; paint-order: stroke fill; }
  .brand .lines { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .brand .lines i { position: absolute; display: block; height: .07em; min-height: 2px; border-radius: 99px; background: #C4C7CC; }
  .brand-start { display: block; width: fit-content; font-size: 40px; margin: 30px auto 22px; }
  .brand-start .lines { transform: scaleX(.8); }
  .brand-bar { font-size: 26px; margin: 0 .3em 0 1.15em; flex: none; }
  .brand-bar .lines { transform: scaleX(.72); }

  /* ---------- intro ---------- */
  #intro { position: fixed; inset: 0; z-index: 50; background: #fff; display: grid; place-items: center;
    overflow: hidden; transition: opacity .3s ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .mover { position: relative; will-change: transform; transform: translateX(-120vw); }
  #intro .brand { font-size: clamp(40px, 11vw, 110px); }
  #intro .puff { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #intro .puff i { position: absolute; border-radius: 50%; background: #E8EAED; opacity: 0; transform: scale(.2); }
  .lead { font-size: 22px; font-weight: 700; color: var(--ink-soft); margin: 10px 0 20px; text-align: center; }
  .prizes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 600px) { .prizes { grid-template-columns: repeat(3, 1fr); } }
  .prize { background: var(--surface); border-radius: 22px; padding: 18px 12px; text-align: center;
    min-height: 108px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; transition: transform .15s, background .15s, box-shadow .15s; }
  .prize:active { transform: scale(.96); }
  .prize .em { font-size: 44px; line-height: 1; }
  .prize .nm { font-size: 18px; font-weight: 800; }
  .prize.picked { background: var(--blue-tint); box-shadow: inset 0 0 0 3px var(--blue); }
  .go { display: block; width: 100%; margin-top: 22px; position: sticky; bottom: calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 0 0 10px var(--bg); padding: 20px; border-radius: 999px;
    background: var(--blue); color: #fff; font-size: 24px; font-weight: 900; transition: opacity .2s, transform .15s; }
  .go:active { transform: scale(.98); }
  .go:disabled { background: #A8C7FA; }

  /* ---------- task screen: sized so all tasks fit on one screen ---------- */
  #play.on { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding-top: calc(14px + env(safe-area-inset-top)); padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex: none; }
  .chip { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 50%;
    background: var(--blue-tint); font-size: 24px; line-height: 1; }
  .tasks { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .task { flex: 1 1 0; min-height: 0; max-height: 96px; display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left; background: var(--surface); border-radius: 20px; padding: 6px 14px 6px 8px;
    transition: background .2s, transform .15s; }
  .task:active { transform: scale(.98); }
  .tasks.locked .task { pointer-events: none; }
  .task .pic { align-self: stretch; aspect-ratio: 1; flex: none; max-height: 84px; }
  .task .pic svg { width: 100%; height: 100%; display: block; }
  .task .lbl { flex: 1; font-size: clamp(19px, 5.4vw, 26px); font-weight: 800; line-height: 1.12; }
  .task .box { width: 40px; height: 40px; flex: none; border-radius: 50%; background: #fff;
    box-shadow: inset 0 0 0 3px #DADCE0; display: grid; place-items: center; transition: background .2s, box-shadow .2s; }
  .task .box svg { width: 24px; height: 24px; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1); }
  .task.done { background: var(--green-tint); }
  .task.done .lbl { color: var(--green); }
  .task.done .box { background: var(--green); box-shadow: none; }
  .task.done .box svg { opacity: 1; transform: scale(1); }
  .task.done .pic { animation: hop .45s ease; }
  @keyframes hop { 30% { transform: translateY(-8px) rotate(-6deg); } 60% { transform: translateY(0) rotate(4deg); } }
  .quit { margin-left: auto; flex: none; background: none; color: var(--ink-soft);
    font-size: 16px; font-weight: 700; padding: 10px 4px 10px 12px; }

  /* ---------- celebration + finish ---------- */
  #veil { position: fixed; inset: 0; background: rgba(255,255,255,.82); opacity: 0; pointer-events: none;
    transition: opacity .4s ease; z-index: 20; }
  #veil.on { opacity: 1; pointer-events: auto; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  @media (prefers-reduced-motion: reduce) { .task.done .pic { animation: none; } }

<body>

<!-- INTRO: logo rushes in from the left, pauses, rushes off to the right leaving a puff. Tap to skip. -->
<div id="intro">
  <div class="mover" id="introMover"><div class="brand" id="introLogo"></div></div>
  <div class="puff" id="puff"></div>
</div>

<!-- START: pick a celebration -->
<section class="screen on" id="start">
  <h1 class="brand brand-start" id="startLogo"></h1>
  <p class="lead">Pick your celebration</p>
  <div class="prizes" id="prizes"></div>
  <button class="go" id="go" disabled>Start</button>
</section>

<!-- TASKS: the checklist -->
<section class="screen" id="play">
  <div class="bar">
    <div class="brand brand-bar" id="barLogo" aria-hidden="true"></div>
    <div class="chip" id="chip"></div>
    <button class="quit" id="quit">Start over</button>
  </div>
  <div class="tasks" id="tasks"></div>
</section>

<div id="veil"></div>

/* ---------- CONFIG 4: CELEBRATIONS (shown in this order) ----------
   Built only with canvas-confetti. Helpers are in the ENGINE section:
   fire(opts), later(fn, ms), every(fn, ms, forMs), loop(ms, fn(p)),
   emoji(char, size), parade(char, size, forMs), rand(a, b).
   duration = how long the screen stays lightened (ms).               */
const CELEBRATIONS = [
  { emoji: '🎉', title: 'Confetti pop', duration: 3500, play() {
      fire({ particleCount: 160, spread: 100, startVelocity: 45, origin: { y: 0.6 }, colors: GOOGLE });
      later(() => fire({ particleCount: 90, spread: 140, startVelocity: 30, origin: { y: 0.5 }, colors: GOOGLE }), 350);
  }},
  { emoji: '🎊', title: 'Side cannons', duration: 4500, play() {
      loop(2500, () => {
        fire({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0, y: 0.75 }, colors: GOOGLE });
        fire({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1, y: 0.75 }, colors: GOOGLE });
      });
  }},
  { emoji: '🎆', title: 'Fireworks', duration: 5500, play() {
      const boom = () => fire({ particleCount: 70, spread: 360, startVelocity: 28, ticks: 70, gravity: 0.8,
        origin: { x: rand(0.15, 0.85), y: rand(0.15, 0.5) },
        colors: [RAINBOW[Math.floor(Math.random() * 7)], '#FFFFFF', '#FBBC04'] });
      boom(); every(boom, 380, 4000);
  }},
  { emoji: '🎈', title: 'Balloon float', duration: 6500, play() {
      const b = emoji('🎈', 3.2);
      const up = () => fire({ particleCount: 2, shapes: [b], scalar: 3.2, flat: true, angle: 90, spread: 30,
        startVelocity: 8, decay: 0.95, gravity: -1.2, drift: rand(-0.6, 0.6), ticks: 330,
        origin: { x: rand(0.1, 0.9), y: 1.08 } });
      up(); every(up, 220, 3200);
  }},
  { emoji: '🌈', title: 'Rainbow rain', duration: 5000, play() {
      loop(2400, p => fire({ particleCount: 6, angle: 270, spread: 25, startVelocity: 12, gravity: 1, ticks: 160,
        origin: { x: p, y: -0.05 }, colors: [RAINBOW[Math.min(6, Math.floor(p * 7))]] }));
  }},
  { emoji: '💖', title: 'Heart burst', duration: 4000, play() {
      const h1 = emoji('💖', 2.4), h2 = emoji('❤️', 2.4);
      fire({ particleCount: 40, shapes: [h1, h2], scalar: 2.4, flat: true, spread: 360,
        startVelocity: 32, gravity: 0.6, ticks: 160, origin: { x: 0.5, y: 0.5 } });
      later(() => fire({ particleCount: 25, shapes: [h1, h2], scalar: 2.4, flat: true, spread: 360,
        startVelocity: 22, gravity: 0.6, ticks: 160, origin: { x: 0.5, y: 0.45 } }), 400);
  }},
  { emoji: '🐧', title: 'Penguin parade', duration: 6500, play() { parade('🐧'); } },
  { emoji: '🐕', title: 'Puppy parade',   duration: 6500, play() { parade('🐕'); } },
  { emoji: '🐈', title: 'Kitty parade',   duration: 6500, play() { parade('🐈'); } },
  { emoji: '🦄', title: 'Unicorn parade', duration: 6500, play() { parade('🦄'); } },
];

/* =====================================================================
   ENGINE — no need to edit below for everyday changes
   ===================================================================== */
const RAINBOW = ['#EA4335', '#FF8A00', '#FBBC04', '#34A853', '#1A73E8', '#7B61FF', '#E040A0'];
const GOOGLE = ['#4285F4', '#EA4335', '#FBBC04', '#34A853'];
const $ = id => document.getElementById(id);
const W = () => window.innerWidth;
const rand = (a, b) => Math.random() * (a - b) + b;

// --- confetti + timer bookkeeping (so a celebration can be cancelled cleanly) ---
const fire = confetti.create($('fx'), { resize: true, useWorker: false });
let fxTimers = [], fxFrames = [];
const later = (fn, ms) => fxTimers.push(setTimeout(fn, ms));
function every(fn, ms, forMs) {
  const id = setInterval(fn, ms); fxTimers.push(id);
  fxTimers.push(setTimeout(() => clearInterval(id), forMs));
}
function loop(ms, fn) {
  const start = performance.now();
  const step = now => { const t = now - start; fn(Math.min(t / ms, 1), t); if (t < ms) fxFrames.push(requestAnimationFrame(step)); };
  fxFrames.push(requestAnimationFrame(step));
}
function stopFx() {
  fxTimers.forEach(id => { clearTimeout(id); clearInterval(id); });
  fxFrames.forEach(cancelAnimationFrame);
  fxTimers = []; fxFrames = [];
  fire.reset();
}
const emoji = (text, scalar = 3) => confetti.shapeFromText({ text, scalar });

// Parade: a stream of one emoji crossing right-to-left (Apple's animal emoji face left).
function parade(char, size = 5.5, forMs = 2800) {
  const shape = emoji(char, size);
  const go = () => {
    const speed = rand(7, 10);
    fire({ particleCount: 1, shapes: [shape], scalar: size, flat: true, angle: 180, spread: 0,
      startVelocity: speed, decay: 1, gravity: 0, ticks: Math.ceil(W() * 3 / speed),
      origin: { x: 1.12, y: rand(0.15, 0.88) } });
  };
  go(); every(go, 230, forMs);
}

// --- state ---
let picked = null;          // index into CELEBRATIONS
let done = new Set();       // indexes into TASKS
let wakeLock = null;
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); try { window.scrollTo(0, 0); } catch (e) {} }

// --- logo ---
// Word colors in order (SO = bright purple, FAST = bright pink), then speed lines as
// [left %, top %, length em] relative to the lettering. Negative or >100 values sit outside it.
const LOGO_COLORS = ['#B23AF2', '#FF3399'];
const LOGO_LINES = [
  [-38, 8, 1.3], [-22, 38, 0.6], [-46, 66, 1.6], [-18, 94, 0.8],    // left
  [6, -16, 0.9], [47, -22, 0.5], [70, -12, 1.1],                      // above
  [18, 112, 1.0], [62, 116, 0.6],                                     // below
  [36, 46, 0.55], [82, 64, 0.7],                                      // between and behind letters
];
function buildLogo(el) {
  const words = SETTINGS.appName.split(' ').map((w, i) =>
    `<span style="color:${LOGO_COLORS[i % LOGO_COLORS.length]}">${w}</span>`).join(' ');
  const lines = LOGO_LINES.map(([x, y, len]) =>
    `<i style="left:${x}%;top:${y}%;width:${len}em"></i>`).join('');
  el.innerHTML = `<span class="lines">${lines}</span><span class="word">${words}</span>`;
}

// --- intro ---
function playIntro() {
  const intro = $('intro'), mover = $('introMover'), puff = $('puff');
  let ended = false;
  const timers = [];
  const end = () => {
    if (ended) return; ended = true;
    timers.forEach(clearTimeout);
    intro.classList.add('gone');
    setTimeout(() => intro.remove(), 350);
  };
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!SETTINGS.showIntro || reduced || !mover.animate) { end(); return; }
  intro.addEventListener('click', end);

  // puff: soft grey circles that bloom and fade where the logo took off
  const blobs = [[30, -30, 70], [-10, -50, 54], [-30, -10, 80], [6, 20, 60], [-44, 26, 46], [44, 6, 44]];
  puff.innerHTML = blobs.map(([x, y, d]) =>
    `<i style="left:${x - d / 2}px;top:${y - d / 2}px;width:${d}px;height:${d}px"></i>`).join('');
  const startPuff = () => [...puff.children].forEach((b, i) => b.animate(
    [{ opacity: 0, transform: 'scale(.2)' }, { opacity: .95, transform: 'scale(1)', offset: .3 },
     { opacity: 0, transform: 'scale(1.6)' }],
    { duration: 750, delay: i * 35, easing: 'ease-out', fill: 'forwards' }));

  const T = 'transform';
  // 1. rush in from the left with a little overshoot
  mover.animate([{ [T]: 'translateX(-120vw)' }, { [T]: 'translateX(4vw)', offset: .78 }, { [T]: 'translateX(0)' }],
    { duration: 560, easing: 'cubic-bezier(.15,.85,.3,1)', fill: 'forwards' });
  // 2. pause, small wind-up, 3. rush off to the right
  timers.push(setTimeout(() => {
    mover.animate([{ [T]: 'translateX(0)' }, { [T]: 'translateX(-5vw)', offset: .3 }, { [T]: 'translateX(140vw)' }],
      { duration: 520, easing: 'cubic-bezier(.55,0,.85,.35)', fill: 'forwards' });
    timers.push(setTimeout(startPuff, 170));
  }, 560 + 1000));
  // 4. reveal the celebration picker
  timers.push(setTimeout(end, 560 + 1000 + 520 + 650));
}

// --- start screen ---
function buildStart() {
  [$('startLogo'), $('barLogo'), $('introLogo')].forEach(buildLogo);
  $('startLogo').setAttribute('aria-label', SETTINGS.appName);
  document.title = SETTINGS.appName;
  $('prizes').innerHTML = '';
  CELEBRATIONS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'prize';
    b.innerHTML = `<span class="em">${c.emoji}</span><span class="nm">${c.title}</span>`;
    b.onclick = () => {
      picked = i;
      document.querySelectorAll('.prize').forEach((p, j) => p.classList.toggle('picked', j === i));
      $('go').disabled = false;
    };
    $('prizes').appendChild(b);
  });
}

// --- task screen ---
function buildTasks() {
  $('tasks').innerHTML = '';
  TASKS.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'task';
    b.innerHTML = `<span class="pic">${PICTURES[t.picture] || ''}</span><span class="lbl">${t.label}</span><span class="box">${CHECK}</span>`;
    b.onclick = () => toggle(i, b);
    $('tasks').appendChild(b);
  });
}

function toggle(i, el) {
  if (done.has(i)) done.delete(i); else done.add(i);
  el.classList.toggle('done', done.has(i));
  if (done.size === TASKS.length) finish();
}

async function begin() {
  if (picked === null) return;
  const c = CELEBRATIONS[picked];
  $('chip').textContent = c.emoji;
  $('chip').setAttribute('aria-label', c.title);
  done = new Set();
  $('tasks').classList.remove('locked');
  buildTasks();
  show('play');
  if (SETTINGS.keepScreenOn && 'wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
}

function celebrate() {
  stopFx();
  $('veil').classList.add('on');
  try { CELEBRATIONS[picked].play(); }
  catch (e) {   // older browsers can't draw emoji confetti; fall back to a plain burst
    fire({ particleCount: 180, spread: 120, startVelocity: 45, origin: { y: 0.6 }, colors: GOOGLE });
  }
}

// All tasks done: lock the list, play the celebration once, then lift the overlay.
// After that the only thing she can tap is "Start over".
function finish() {
  $('tasks').classList.add('locked');
  celebrate();
  later(() => $('veil').classList.remove('on'), CELEBRATIONS[picked].duration);
}

function reset() {
  stopFx();
  $('veil').classList.remove('on');
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  picked = null;
  $('go').disabled = true;
  document.querySelectorAll('.prize').forEach(p => p.classList.remove('picked'));
  show('start');
}

$('go').onclick = begin;
$('quit').onclick = () => {
  const partway = done.size > 0 && done.size < TASKS.length;
  if (!SETTINGS.confirmStartOver || !partway || confirm('Start over?')) reset();
};
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && SETTINGS.keepScreenOn && $('play').classList.contains('on') && 'wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
});

buildStart();
playIntro();
</script>
